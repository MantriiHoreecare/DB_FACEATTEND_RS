<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEATTEND RS - Apps Script Connected System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hospital: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      @keyframes pulse-ring { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 0.4; } 100% { transform: scale(0.95); opacity: 0.8; } }
      .animate-scan { animation: pulse-ring 2s infinite ease-in-out; }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        // PASTEKAN WEB APP URL HASIL DEPLOY GOOGLE APPS SCRIPT ANDA DI SINI
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz_REPLACE_WITH_YOUR_DEPLOYED_GAS_ID/exec";

        function App() {
            const [apiUrl, setApiUrl] = React.useState(GAS_WEB_APP_URL);
            const [isConfigured, setIsConfigured] = React.useState(!GAS_WEB_APP_URL.includes("REPLACE_WITH_YOUR"));
            const [loading, setLoading] = React.useState(false);
            const [syncing, setSyncing] = React.useState(false);
            
            // App Data State
            const [dbData, setDbData] = React.useState({
              profiles: [],
              departments: [],
              shifts: [],
              attendance: [],
              auditLogs: [],
              leaveRequests: []
            });
            
            const [currentUser, setCurrentUser] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('terminal');
            const [currentTime, setCurrentTime] = React.useState(new Date());

            // Live Time WIB
            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Fetch Data from Google Sheets
            const fetchData = React.useCallback(async (targetUrl = apiUrl) => {
                if (!targetUrl || targetUrl.includes("REPLACE_WITH_YOUR")) return;
                setSyncing(true);
                try {
                    const res = await fetch(targetUrl + "?action=getAllData");
                    const result = await res.json();
                    if (result.status === 'success') {
                        setDbData(result.data);
                        if (!currentUser && result.data.profiles.length > 0) {
                            setCurrentUser(result.data.profiles[0]); // Default login as first user
                        }
                    }
                } catch (err) {
                    console.error("Gagal koneksi ke Google Sheets:", err);
                } finally {
                    setSyncing(false);
                }
            }, [apiUrl, currentUser]);

            React.useEffect(() => {
                if (isConfigured) {
                    fetchData();
                }
            }, [isConfigured]);

            if (!isConfigured) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-lg w-full space-y-6 text-center shadow-2xl">
                            <div className="inline-flex p-4 bg-sky-500/10 text-sky-400 rounded-2xl mb-2">
                                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            </div>
                            <h2 className="text-2xl font-bold text-white">Sambungkan ke Google Apps Script</h2>
                            <p className="text-sm text-slate-400">Masukkan **Web App URL** dari Google Apps Script untuk mulai menyinkronkan data absensi secara real-time dengan Google Sheets RS.</p>
                            
                            <input 
                                type="url" 
                                placeholder="https://script.google.com/macros/s/.../exec"
                                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-sky-500"
                                value={apiUrl}
                                onChange={(e) => setApiUrl(e.target.value)}
                            />

                            <button 
                                onClick={() => {
                                    if(apiUrl.includes("script.google.com")) {
                                        setIsConfigured(true);
                                        fetchData(apiUrl);
                                    } else {
                                        alert("Masukkan Web App URL Google Apps Script yang valid!");
                                    }
                                }}
                                className="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-sky-600/30"
                            >
                                Hubungkan Database
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col overflow-hidden bg-slate-950">
                    {/* Top Navigation */}
                    <header className="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="p-2 bg-sky-600 rounded-xl text-white font-black text-xl">FA</div>
                            <div>
                                <h1 className="font-bold text-slate-100 text-lg leading-none">FACEATTEND RS</h1>
                                <span className="text-[10px] text-sky-400 font-medium">GOOGLE SHEETS BACKEND ACTIVE</span>
                            </div>
                        </div>

                        {/* Realtime Timezone WIB */}
                        <div className="hidden md:flex items-center space-x-6 text-right">
                            <div>
                                <p className="text-xs text-slate-400 uppercase font-semibold">Waktu Operasional RS</p>
                                <p className="text-sm font-bold text-sky-400 font-mono">
                                    {currentTime.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })} | {currentTime.toLocaleTimeString('id-ID')} WIB
                                </p>
                            </div>
                            <button onClick={() => fetchData()} className={`p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs flex items-center space-x-2 ${syncing ? 'animate-spin text-sky-400' : 'text-slate-300'}`}>
                                🔄
                            </button>
                        </div>

                        {/* User Profile Switcher */}
                        <div className="flex items-center space-x-3">
                            <select 
                                className="bg-slate-800 border border-slate-700 text-xs rounded-xl px-3 py-2 text-slate-200"
                                value={currentUser?.id || ''}
                                onChange={(e) => {
                                    const u = dbData.profiles.find(p => p.id === e.target.value);
                                    if (u) setCurrentUser(u);
                                }}
                            >
                                {dbData.profiles.map(p => (
                                    <option key={p.id} value={p.id}>{p.full_name} ({p.role})</option>
                                ))}
                            </select>
                        </div>
                    </header>

                    {/* Main Layout Body */}
                    <div className="flex-1 flex overflow-hidden">
                        {/* Sidebar Navigation */}
                        <aside className="w-64 bg-slate-900 border-r border-slate-800 p-4 space-y-2 hidden md:block">
                            <SidebarButton active={activeTab === 'terminal'} onClick={() => setActiveTab('terminal')} icon="📸" label="Terminal Absensi Wajah" />
                            <SidebarButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="📊" label="Dashboard Kehadiran" />
                            <SidebarButton active={activeTab === 'employees'} onClick={() => setActiveTab('employees')} icon="👥" label="Data Pegawai RS" />
                            <SidebarButton active={activeTab === 'leave'} onClick={() => setActiveTab('leave')} icon="📑" label="Pengajuan Cuti / Izin" />
                            <SidebarButton active={activeTab === 'logs'} onClick={() => setActiveTab('logs')} icon="📜" label="Audit Logs System" />
                        </aside>

                        {/* View Content Router */}
                        <main className="flex-1 overflow-y-auto p-6 bg-slate-950">
                            {activeTab === 'terminal' && <AttendanceTerminal user={currentUser} apiUrl={apiUrl} onRefresh={fetchData} />}
                            {activeTab === 'dashboard' && <DashboardView data={dbData} />}
                            {activeTab === 'employees' && <EmployeesView profiles={dbData.profiles} apiUrl={apiUrl} onRefresh={fetchData} />}
                            {activeTab === 'leave' && <LeaveView leaveRequests={dbData.leaveRequests} user={currentUser} apiUrl={apiUrl} onRefresh={fetchData} />}
                            {activeTab === 'logs' && <AuditLogsView logs={dbData.auditLogs} />}
                        </main>
                    </div>
                </div>
            );
        }

        function AttendanceTerminal({ user, apiUrl, onRefresh }) {
            const [verifying, setVerifying] = React.useState(false);
            const [successMsg, setSuccessMsg] = React.useState('');
            const [livenessStep, setLivenessStep] = React.useState('Standby');

            const handleAttendance = async (type) => {
                if (!user) return alert("Pilih pegawai terlebih dahulu!");
                setVerifying(true);
                setLivenessStep('Deteksi Kedipan Mata...');

                setTimeout(async () => {
                    setLivenessStep('Pencocokan Biometrik Wajah...');
                    
                    setTimeout(async () => {
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                        const dateStr = now.toISOString().split('T')[0];

                        const record = {
                            employeeId: user.id,
                            employeeName: user.full_name,
                            department: user.department,
                            date: dateStr,
                            clockIn: type === 'IN' ? timeStr : '',
                            clockOut: type === 'OUT' ? timeStr : '',
                            status: type === 'IN' ? 'Hadir (Tepat Waktu)' : 'Pulang',
                            distanceMeter: Math.floor(Math.random() * 25) + 5, // Simulated 5-30m GPS Geofence
                            method: 'Biometric Face ID + Liveness'
                        };

                        try {
                            await fetch(apiUrl, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'saveAttendance', record })
                            });
                            setSuccessMsg(`Absen ${type === 'IN' ? 'Masuk' : 'Pulang'} Berhasil Dicatat pada ${timeStr} WIB!`);
                            onRefresh();
                        } catch (e) {
                            alert("Gagal menyimpan absensi ke Google Sheets");
                        } finally {
                            setVerifying(false);
                            setLivenessStep('Standby');
                        }
                    }, 1200);
                }, 1000);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-xl">
                        <h2 className="text-xl font-bold text-white">Kamera Verifikasi Wajah Real-Time</h2>
                        <p className="text-xs text-slate-400">Pastikan wajah Anda berada di dalam bingkai oval di bawah ini.</p>

                        {/* Simulated Biometric Camera Viewfinder */}
                        <div className="relative w-72 h-80 mx-auto bg-slate-950 rounded-3xl border-2 border-sky-500/40 overflow-hidden flex flex-col items-center justify-center">
                            <div className="absolute inset-0 bg-gradient-to-b from-sky-500/10 to-transparent"></div>
                            <div className="w-48 h-60 border-2 border-dashed border-sky-400 rounded-full animate-scan flex items-center justify-center">
                                <span className="text-4xl">👤</span>
                            </div>

                            {verifying && (
                                <div className="absolute inset-0 bg-slate-950/80 backdrop-blur flex flex-col items-center justify-center space-y-2">
                                    <div className="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
                                    <span className="text-xs font-bold text-sky-400">{livenessStep}</span>
                                </div>
                            )}
                        </div>

                        {/* Live User Info */}
                        <div className="bg-slate-950/50 p-4 rounded-2xl border border-slate-800/80 flex items-center justify-between text-left">
                            <div>
                                <p className="text-xs text-slate-400">Pegawai Aktif:</p>
                                <p className="text-sm font-bold text-white">{user?.full_name || 'Belum Dipilih'}</p>
                                <p className="text-xs text-sky-400">{user?.department}</p>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-[10px] font-bold ${user?.face_registered === 'Ya' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'}`}>
                                {user?.face_registered === 'Ya' ? 'Wajah Terdaftar' : 'Belum Registrasi'}
                            </span>
                        </div>

                        {/* Attendance Action Buttons */}
                        <div className="grid grid-cols-2 gap-4">
                            <button 
                                disabled={verifying}
                                onClick={() => handleAttendance('IN')} 
                                className="py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl transition-all shadow-lg shadow-emerald-600/20 disabled:opacity-50"
                            >
                                ABSEN MASUK
                            </button>
                            <button 
                                disabled={verifying}
                                onClick={() => handleAttendance('OUT')} 
                                className="py-4 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-2xl transition-all shadow-lg shadow-rose-600/20 disabled:opacity-50"
                            >
                                ABSEN PULANG
                            </button>
                        </div>

                        {successMsg && (
                            <div className="p-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-2xl text-xs font-bold">
                                {successMsg}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function DashboardView({ data }) {
            return (
                <div className="space-y-6">
                    <h2 className="text-xl font-bold text-white">Dashboard Kehadiran Rumah Sakit</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <MetricCard title="Total Pegawai" value={data.profiles.length} icon="👥" color="sky" />
                        <MetricCard title="Hadir Hari Ini" value={data.attendance.length} icon="✅" color="emerald" />
                        <MetricCard title="Pengajuan Cuti" value={data.leaveRequests.length} icon="📑" color="amber" />
                        <MetricCard title="Total Unit Kerja" value={data.departments.length} icon="🏥" color="indigo" />
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
                        <h3 className="font-bold text-white text-sm">Catatan Absensi Terkini (Google Sheets)</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-300">
                                <thead className="bg-slate-950 text-slate-400 uppercase font-semibold">
                                    <tr>
                                        <th className="p-3">Pegawai</th>
                                        <th className="p-3">Unit Kerja</th>
                                        <th className="p-3">Tanggal</th>
                                        <th className="p-3">Masuk</th>
                                        <th className="p-3">Pulang</th>
                                        <th className="p-3">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {data.attendance.length === 0 ? (
                                        <tr><td colSpan="6" className="p-4 text-center text-slate-500">Belum ada rekam absensi</td></tr>
                                    ) : (
                                        data.attendance.map((rec, i) => (
                                            <tr key={i} className="hover:bg-slate-800/50">
                                                <td className="p-3 font-semibold text-white">{rec.employee_name}</td>
                                                <td className="p-3">{rec.department}</td>
                                                <td className="p-3">{rec.date}</td>
                                                <td className="p-3 font-mono text-emerald-400">{rec.clock_in || '-'}</td>
                                                <td className="p-3 font-mono text-rose-400">{rec.clock_out || '-'}</td>
                                                <td className="p-3"><span className="px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 text-[10px]">{rec.status}</span></td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function EmployeesView({ profiles, apiUrl, onRefresh }) {
            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold text-white">Data Pegawai RS</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {profiles.map(p => (
                            <div key={p.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center space-x-4">
                                <img src={p.avatar || 'https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=150'} className="w-12 h-12 rounded-full object-cover border border-slate-700" />
                                <div>
                                    <h4 className="font-bold text-white text-sm">{p.full_name}</h4>
                                    <p className="text-xs text-sky-400">{p.department} • {p.role}</p>
                                    <p className="text-[10px] text-slate-500 mt-1">NIP: {p.nip}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function LeaveView({ leaveRequests, user, apiUrl, onRefresh }) {
            return (
                <div className="space-y-6">
                    <h2 className="text-xl font-bold text-white">Pengajuan Cuti / Izin</h2>
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <table className="w-full text-left text-xs text-slate-300">
                            <thead className="bg-slate-950 text-slate-400">
                                <tr>
                                    <th className="p-3">Pegawai</th>
                                    <th className="p-3">Tipe</th>
                                    <th className="p-3">Tanggal Mulai</th>
                                    <th className="p-3">Alasan</th>
                                    <th className="p-3">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {leaveRequests.length === 0 ? (
                                    <tr><td colSpan="5" className="p-4 text-center text-slate-500">Tidak ada pengajuan cuti</td></tr>
                                ) : (
                                    leaveRequests.map((l, i) => (
                                        <tr key={i}>
                                            <td className="p-3 font-semibold text-white">{l.employee_name}</td>
                                            <td className="p-3">{l.type}</td>
                                            <td className="p-3">{l.start_date}</td>
                                            <td className="p-3">{l.reason}</td>
                                            <td className="p-3"><span className="px-2 py-1 bg-amber-500/10 text-amber-400 rounded text-[10px]">{l.status}</span></td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function AuditLogsView({ logs }) {
            return (
                <div className="space-y-6">
                    <h2 className="text-xl font-bold text-white">Audit Logs System</h2>
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <div className="space-y-3">
                            {logs.map((log, i) => (
                                <div key={i} className="p-3 bg-slate-950 rounded-xl border border-slate-800/80 text-xs flex justify-between items-center">
                                    <div>
                                        <span className="font-bold text-sky-400">[{log.action}]</span> <span className="text-slate-200">{log.details}</span>
                                        <p className="text-[10px] text-slate-500 mt-0.5">Oleh: {log.user_info}</p>
                                    </div>
                                    <span className="text-[10px] font-mono text-slate-400">{log.timestamp}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function MetricCard({ title, value, icon, color }) {
            return (
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between">
                    <div>
                        <p className="text-xs text-slate-400">{title}</p>
                        <p className="text-2xl font-black text-white mt-1">{value}</p>
                    </div>
                    <span className="text-2xl p-3 bg-slate-950 rounded-xl border border-slate-800">{icon}</span>
                </div>
            );
        }

        function SidebarButton({ active, onClick, icon, label }) {
            return (
                <button 
                    onClick={onClick}
                    className={`w-full text-left px-4 py-3 rounded-2xl text-xs font-semibold flex items-center space-x-3 transition-all ${
                        active ? 'bg-sky-600 text-white shadow-lg shadow-sky-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                >
                    <span>{icon}</span>
                    <span>{label}</span>
                </button>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
